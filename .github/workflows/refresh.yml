# Keep-awake pings for the FunPop Sales Dashboard.
#
# The heavy BigQuery work now happens in snapshot.yml, which writes results to
# a durable table. This workflow's only job is to keep the Streamlit Community
# Cloud container awake (and warm its in-memory cache from the fast snapshot)
# so the morning visit doesn't hit a ~30s cold-boot. A plain curl only fetches
# the static shell; Streamlit runs the script only inside a real browser
# session, so we use a headless browser (Playwright).
#
# Schedule is clustered tightly around the ~8am Central visit. After that we
# stop — the app is allowed to sleep during the day and will wake on demand.
#
# DST: GitHub cron is UTC only; both Central offsets are scheduled. The
# off-season triggers fire an hour off but harmlessly just load the page.
#
# Note: GitHub Actions cron is best-effort and can be delayed or skipped under
# load, so timing is approximate.

name: Dashboard keep-awake

on:
  schedule:
    # Tight cluster ~7:15-8:15am Central so the app is awake and warmed when
    # the dashboard is opened around 8am.
    # CDT (UTC-5): 7am=12:00, 8am=13:00 UTC.
    - cron: '15,45 12 * * *'   # 7:15 & 7:45am CDT
    - cron: '15 13 * * *'      # 8:15am CDT
    # CST (UTC-6): 7am=13:00, 8am=14:00 UTC.
    - cron: '15,45 13 * * *'   # 7:15 & 7:45am CST
    - cron: '15 14 * * *'      # 8:15am CST
  workflow_dispatch:           # manual trigger from the Actions tab

concurrency:
  group: dashboard-keepawake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (Chromium)
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Ping dashboard (wake the container, warm cache from snapshot)
        env:
          DASHBOARD_URL: https://funpop-dashboard.streamlit.app/
        run: |
          cat > ping.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = process.env.DASHBOARD_URL;
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            console.log(`Loading ${url} ...`);
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });

            // If Community Cloud put the app to sleep, click the wake button.
            try {
              await page.getByRole('button', { name: /get this app back up/i })
                .click({ timeout: 8000 });
              console.log('Clicked wake button.');
            } catch { /* app was already awake */ }

            // Reading from the snapshot is fast, so a short settle is enough to
            // finish a script run and leave the container awake + warmed.
            await page.waitForLoadState('networkidle', { timeout: 120000 }).catch(() => {});
            await page.waitForTimeout(20000);

            console.log('Pinged. Title:', await page.title());
          } finally {
            await browser.close();
          }
          EOF
          node ping.mjs
