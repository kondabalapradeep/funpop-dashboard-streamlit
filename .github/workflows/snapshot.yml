# Builds the durable dashboard data snapshot and publishes it to the
# `snapshot-data` branch as a single force-pushed commit.
#
# Why: Streamlit Community Cloud discards the app's in-memory @st.cache_data
# whenever the process restarts (sleep, redeploy, recycle). Without a durable
# copy, a visitor who lands after a restart re-runs every BigQuery pull — which
# is why the dashboard wasn't already loaded at 8am.
#
# The dashboard's service-account key is read-only, so we can't write a snapshot
# back into BigQuery. Instead this job runs the same read-only queries and
# publishes the results as parquet files on the `snapshot-data` branch — NOT the
# deploy branch. Committing them to main grew the repo's history ~3.5 MB/day
# without bound and triggered a full Streamlit redeploy on every build
# (restarting the container and dumping its warm cache right before the morning
# visit). The orphan branch keeps exactly one commit, so the repo stays small
# and deploys never churn; the app downloads the files from the branch's raw
# URL on a cache miss (see snapshot.py) and falls back to a live query if
# anything is missing. Pair with refresh.yml (keep-awake pings).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   GCP_SERVICE_ACCOUNT_JSON  the full service-account JSON (the same read-only
#                             key pasted into Streamlit Cloud's secrets).
#   BQ_DATASET                the dataset name holding the source tables
#                             (the value of st.secrets["bigquery"]["dataset"]).
# No BigQuery write access is needed.
#
# DST: GitHub cron is UTC only. We schedule both Central offsets; the off-season
# triggers run an hour off but just rebuild from the same source, so harmless.

name: Build dashboard snapshot

on:
  schedule:
    # Morning-only schedule. The store feed lands once a day around 7am Central;
    # builds outside that window can only produce intraday churn (which the
    # business_date gate would skip anyway), so they'd just waste runs. The
    # build runs at :17 and :47 across 6-9am Central to catch the feed
    # whenever it lands. DST: GitHub cron is UTC only, so both offsets listed.
    - cron: '17,47 11-14 * * *'   # 6:17/6:47..9:17/9:47am CDT (UTC-5)
    - cron: '17,47 12-15 * * *'   # 6:17/6:47..9:17/9:47am CST (UTC-6)
  workflow_dispatch:           # manual trigger from the Actions tab

# Needed so the job can force-push the snapshot-data branch.
permissions:
  contents: write

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # Same pins as the app so the snapshot serializes/deserializes identically.
        run: pip install -r requirements.txt

      - name: Restore previous snapshot (for build gating / change detection)
        # snapshot_build.py gates the rebuild on the store feed's max
        # business_date actually advancing past the previous build's, so the
        # prior snapshot must be on disk first. /tmp/snapprev keeps a pristine
        # copy for the publish step's "did anything change?" check.
        run: |
          mkdir -p snapshot_data /tmp/snapprev
          if git fetch --depth 1 origin snapshot-data; then
            git archive FETCH_HEAD | tar -x -C snapshot_data
            cp -a snapshot_data/. /tmp/snapprev/
          else
            echo "No snapshot-data branch yet; the first build will create it."
          fi

      - name: Build snapshot
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
        run: python snapshot_build.py

      - name: Publish snapshot-data branch (single commit, force-pushed)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # built_at.txt is only rewritten when some file's content actually
          # changed, so it doubles as the cheap "anything to publish?" check
          # (the business_date gate's skip path leaves it untouched).
          if [ -f /tmp/snapprev/built_at.txt ] && cmp -s /tmp/snapprev/built_at.txt snapshot_data/built_at.txt; then
            echo "Snapshot unchanged; nothing to publish."
            exit 0
          fi
          cd snapshot_data
          rm -rf .git
          git init -q -b snapshot-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dashboard snapshot $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:snapshot-data
